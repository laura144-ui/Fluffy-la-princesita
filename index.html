<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Fluffy & La Princesita ♡</title>


<style>

/* ==============================
   CONFIGURACIÓN GENERAL
================================ */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background: #08091d;
  overflow: hidden;
}


/* ==============================
   PORTADA
================================ */

#portada {

  position: fixed;

  top: 0;
  left: 0;

  width: 100vw;
  height: 100vh;

  background-color: #08091d;

  background-image:
   background-image: url("./ChatGPT Image 23 ago 2026, 22_27_34.png");

  background-repeat: no-repeat;

  background-position: center;

  background-size: contain;

}


/* ==============================
   BOTÓN INVISIBLE
================================ */

#comenzar {

  position: absolute;

  left: 50%;
  top: 70%;

  transform:
    translate(-50%, -50%);

  width: 420px;

  max-width: 75vw;

  height: 90px;

  /* Lo dejamos visible por ahora
     para comprobar dónde pulsamos */

  border:
    3px solid
    rgba(255, 150, 200, 0.8);

  border-radius: 15px;

  background:
    rgba(255, 120, 180, 0.15);

  cursor: pointer;

  z-index: 10;

}


/* Al pulsarlo */

#comenzar:active {

  background:
    rgba(255, 150, 200, 0.35);

}


/* ==============================
   PANTALLA DE PRUEBA
================================ */

#juego {

  display: none;

  width: 100vw;
  height: 100vh;

  background:

    linear-gradient(
      #0d1030,
      #26224c
    );

  color: #ffd7e4;

  font-family:
    monospace;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

  padding: 30px;

}


#juego h1 {

  font-size:
    clamp(
      30px,
      8vw,
      60px
    );

  margin-bottom: 20px;

  color: #f2a1bd;

}


#juego p {

  font-size:
    clamp(
      15px,
      4vw,
      20px
    );

  line-height: 1.6;

}


/* ==============================
   MÓVIL
================================ */

@media
(max-width: 600px) {

  #portada {

    background-size:
      contain;

  }


  #comenzar {

    width: 72vw;

    height: 75px;

    top: 70%;

  }

}

</style>

</head>



<body>


<!-- ==========================
     PORTADA
=========================== -->

<div id="portada">


  <button
    id="comenzar"
    aria-label="Comenzar aventura">
  </button>


</div>



<!-- ==========================
     PRUEBA DEL JUEGO
=========================== -->

<div id="juego">


  <h1>
    ♡ FUNCIONA ♡
  </h1>


  <p>
    Fluffy 🧸 y La Princesita 🐱👑
    están listas para comenzar
    su aventura.
  </p>


</div>



<script>


/* Cogemos los elementos */

const portada =
  document.getElementById(
    "portada"
  );


const comenzar =
  document.getElementById(
    "comenzar"
  );


const juego =
  document.getElementById(
    "juego"
  );



/* Cuando pulsamos */

comenzar.addEventListener(
  "click",
  function () {


    /* Ocultamos portada */

    portada.style.display =
      "none";


    /* Mostramos juego */

    juego.style.display =
      "flex";


  }
);


</script>


</body>

</html>
