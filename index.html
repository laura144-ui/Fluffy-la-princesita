<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fluffy & La Princesita ♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #08091d;
    }

    body {
      overflow: hidden;
    }

    /* PORTADA */

    #portada {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #08091d;
    }

    #imagenPortada {
      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;
    }

    /* BOTÓN INVISIBLE ENCIMA DE LA IMAGEN */

    #comenzar {
      position: absolute;

      left: 50%;
      top: 54%;

      transform: translate(-50%, -50%);

      width: min(320px, 62vw);
      height: 70px;

      border: 3px solid rgba(255, 160, 200, 0.75);
      background: rgba(255, 130, 180, 0.12);

      border-radius: 18px;

      cursor: pointer;
      z-index: 10;
    }

    /* PANTALLA DE PRUEBA */

    #juego {
      display: none;

      width: 100vw;
      height: 100vh;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      background: linear-gradient(
        #0c1030,
        #28234e
      );

      color: #ffd4e1;

      font-family: monospace;
      text-align: center;

      padding: 30px;
    }

    #juego h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    #juego p {
      font-size: 18px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {

      #imagenPortada {
        object-fit: contain;
      }

      #comenzar {
        width: 65vw;
        height: 65px;
        top: 54%;
      }
    }
  </style>
</head>

<body>

  <div id="portada">

   <img
  id="imagenPortada"
  src="https://raw.githubusercontent.com/laura144-ui/Fluffy-la-princesita/main/ChatGPT%20Image%2023%20ago%202026%2C%2022_27_34.png"
  alt="Fluffy y La Princesita"
>
    

    <button
      id="comenzar"
      aria-label="Comenzar aventura">
    </button>

  </div>


  <div id="juego">

    <h1>♡ FUNCIONA ♡</h1>

    <p>
      Fluffy 🧸 y La Princesita 🐱👑<br>
      están listas para comenzar su aventura.
    </p>

  </div>


  <script>

    const portada =
      document.getElementById("portada");

    const comenzar =
      document.getElementById("comenzar");

    const juego =
      document.getElementById("juego");


    comenzar.addEventListener("click", function () {

      portada.style.display = "none";

      juego.style.display = "flex";

    });

  </script>

</body>
</html>
