<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fluffy & La Princesita ♡</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #08091d;
  overflow: hidden;
}

/* PORTADA */

#portada {
  position: fixed;
  inset: 0;

  background-image: url("./portada.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;

  background-color: #08091d;
}

/* BOTÓN CLICABLE */

#comenzar {
  position: absolute;

  left: 50%;
  top: 68%;

  transform: translate(-50%, -50%);

  width: 420px;
  max-width: 75vw;
  height: 90px;

  border: 3px solid rgba(255, 150, 200, 0.7);
  border-radius: 15px;

  background: rgba(255, 150, 200, 0.12);

  cursor: pointer;
}

/* PANTALLA DE PRUEBA */

#juego {
  display: none;

  width: 100vw;
  height: 100vh;

  background: #141738;

  color: #ffd5e3;

  font-family: monospace;

  align-items: center;
  justify-content: center;
  flex-direction: column;

  text-align: center;
}

#juego h1 {
  font-size: 35px;
  margin-bottom: 20px;
}

#juego p {
  font-size: 18px;
}

/* MÓVIL */

@media (max-width: 600px) {

  #portada {
    background-size: contain;
  }

  #comenzar {
    width: 70vw;
    height: 70px;

    /* luego lo ajustaremos */
    top: 68%;
  }

}

</style>
</head>

<body>


<div id="portada">

  <button
    id="comenzar"
    aria-label="Comenzar aventura">
  </button>

</div>


<div id="juego">

  <h1>♡ FUNCIONA ♡</h1>

  <p>
    Fluffy y La Princesita están listas para su aventura.
  </p>

</div>


<script>

const portada = document.getElementById("portada");
const juego = document.getElementById("juego");
const comenzar = document.getElementById("comenzar");

comenzar.addEventListener("click", function() {

  portada.style.display = "none";
  juego.style.display = "flex";

});

</script>


</body>
</html>
